<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחלץ נתונים פיננסיים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; background: linear-gradient(-45deg, #0f172a, #1e293b, #334155, #1e1b4b); background-size: 400% 400%; animation: gradient 15s ease infinite; min-height: 100vh; }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .loader { border-top-color: #6366f1; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="max-w-4xl w-full glass rounded-[2rem] shadow-2xl p-8 md:p-12">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-slate-800 mb-2">מחלץ נתוני שוק</h1>
            <p class="text-slate-600">שליפת שערי סגירה היסטוריים בהשוואה רב-מנייתית</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="flex flex-col">
                <label class="font-semibold text-slate-700 mb-1">סימולי מניות (באנגלית)</label>
                <input id="tickers" type="text" placeholder="AAPL, MSFT, GOOGL" class="p-3 rounded-xl border outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                <span class="text-xs text-slate-400 mt-1">השתמש בפסיק להפרדה</span>
            </div>
            <div class="flex flex-col">
                <label class="font-semibold text-slate-700 mb-1">תדירות</label>
                <select id="frequency" class="p-3 rounded-xl border bg-white outline-none">
                    <option value="DAILY">יומי</option>
                    <option value="WEEKLY">שבועי</option>
                    <option value="MONTHLY">חודשי</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="font-semibold text-slate-700 mb-1">תאריך התחלה</label>
                <input id="startDate" type="date" class="p-3 rounded-xl border outline-none">
            </div>
            <div class="flex flex-col">
                <label class="font-semibold text-slate-700 mb-1">תאריך סיום</label>
                <input id="endDate" type="date" class="p-3 rounded-xl border outline-none">
            </div>
        </div>

        <button onclick="fetchData()" id="mainBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl text-xl shadow-lg transition-all flex items-center justify-center gap-3">
            <span>טען נתונים</span>
            <div id="loader" class="hidden w-6 h-6 border-4 border-white/30 loader rounded-full"></div>
        </button>

        <div id="statusMsg" class="hidden mt-6 p-4 rounded-xl text-center font-semibold text-sm"></div>

        <div id="previewContainer" class="hidden mt-10 overflow-x-auto rounded-xl border border-slate-200 bg-white/50">
            <h3 class="font-bold text-slate-800 p-4 border-b">תצוגה מקדימה</h3>
            <div id="tableContent"></div>
        </div>

        <div id="exportArea" class="hidden mt-8 grid grid-cols-1 md:grid-cols-2 gap-4">
            <button onclick="downloadCSV()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-md transition-all">📂 הורד קובץ CSV</button>
            <button onclick="exportToSheet()" id="sheetBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
                📊 ייצא ל-Google Sheets
                <div id="sheetLoader" class="hidden w-4 h-4 border-2 border-white/30 loader rounded-full"></div>
            </button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzXcY8aMPd4oeCBIG-abi8_b4ExHQSzpHlcblmggQ40VS7G_Une6F6eyRsAk33hBMCa/exec';
        let globalCsvData = "";

        // הגבלת תאריכים
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').setAttribute('max', today);
        document.getElementById('endDate').setAttribute('max', today);

        function validateForm(payload) {
            if (!payload.tickers || !payload.startDate || !payload.endDate) return "נא למלא את כל השדות.";
            if (/[א-ת]/.test(payload.tickers)) return "נא להשתמש באותיות באנגלית בלבד עבור סימולי המניות.";
            if (new Date(payload.startDate) >= new Date(payload.endDate)) return "תאריך ההתחלה חייב להיות מוקדם מתאריך הסיום.";
            return null;
        }

        async function fetchData() {
            const payload = {
                tickers: document.getElementById('tickers').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                frequency: document.getElementById('frequency').value,
                action: 'csv'
            };

            const err = validateForm(payload);
            if (err) { showAlert(err, "error"); return; }

            toggleLoading(true);
            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.status === "success") {
                    globalCsvData = data.csvData;
                    renderPreviewTable(data.csvData);
                    document.getElementById('exportArea').classList.remove('hidden');
                    document.getElementById('previewContainer').classList.remove('hidden');
                    
                    if (data.invalidTickers && data.invalidTickers.length > 0) {
                        showAlert(`הנתונים נטענו, אך לא נמצאו נתונים עבור: ${data.invalidTickers.join(', ')}`, "warning");
                    } else {
                        showAlert("הנתונים נשלפו בהצלחה!", "success");
                    }
                } else {
                    throw new Error(data.message);
                }
            } catch (e) {
                showAlert(e.message, "error");
            } finally {
                toggleLoading(false);
            }
        }

        function renderPreviewTable(csv) {
            const rows = csv.split('\n').slice(0, 7);
            let h = `<table class="w-full text-right"><thead class="bg-slate-100"><tr>`;
            rows[0].split(',').forEach(cell => h += `<th class="p-3 text-slate-700 text-sm font-bold">${cell}</th>`);
            h += `</tr></thead><tbody>`;
            for (let i = 1; i < rows.length; i++) {
                if (!rows[i]) continue;
                h += `<tr class="border-t">`;
                rows[i].split(',').forEach(cell => h += `<td class="p-3 text-slate-600 text-sm">${cell}</td>`);
                h += `</tr>`;
            }
            document.getElementById('tableContent').innerHTML = h + `</tbody></table>`;
        }

        function downloadCSV() {
            const b = new Blob([globalCsvData], {type: 'text/csv'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = `stocks_${Date.now()}.csv`;
            a.click();
        }

        async function exportToSheet() {
            const btn = document.getElementById('sheetBtn'), l = document.getElementById('sheetLoader');
            btn.disabled = true; l.classList.remove('hidden');
            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ ...JSON.parse(JSON.stringify(getFormData())), action: 'sheet' })
                });
                const data = await res.json();
                if (data.status === "success") showAlert(`גיליון נוצר: <a href="${data.sheetUrl}" target="_blank" class="underline font-bold">לחץ כאן</a>`, "success");
            } catch (e) { showAlert("ייצוא נכשל", "error"); }
            finally { btn.disabled = false; l.classList.add('hidden'); }
        }

        function getFormData() {
            return {
                tickers: document.getElementById('tickers').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                frequency: document.getElementById('frequency').value
            };
        }

        function toggleLoading(s) {
            document.getElementById('mainBtn').disabled = s;
            document.getElementById('loader').classList.toggle('hidden', !s);
        }

        function showAlert(m, t) {
            const el = document.getElementById('statusMsg');
            el.innerHTML = m; el.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-yellow-100', 'text-yellow-700');
            const c = t === "error" ? 'bg-red-100 text-red-700' : (t === "warning" ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700');
            el.className = `mt-6 p-4 rounded-xl text-center font-semibold text-sm ${c}`;
        }
    </script>
</body>
</html>
