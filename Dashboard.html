<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Data Extractor | מערכת חילוץ נתונים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #334155, #1e1b4b);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .loader {
            border-top-color: #6366f1;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-glow:hover {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="max-w-4xl w-full glass rounded-[2rem] shadow-2xl p-8 md:p-12 transition-all duration-500">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-slate-800 mb-4">מחלץ נתוני שוק</h1>
            <p class="text-lg text-slate-600 leading-relaxed">
                ברוכים הבאים למערכת חילוץ הנתונים. כאן תוכלו לשלוף שערי סגירה למספר מניות במקביל, להשוות ביניהן בסדרות-זמן, ולייצא בקליק.
            </p>
        </header>

        <!-- Form -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="flex flex-col">
                <label class="font-semibold text-slate-700 mb-2">סימולי מניות</label>
                <input id="tickers" type="text" placeholder="AAPL, TSLA, MSFT" 
                    class="p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                <span class="text-xs text-slate-500 mt-1">הזן סימולי מניות, מופרדים בפסיק</span>
            </div>

            <div class="flex flex-col">
                <label class="font-semibold text-slate-700 mb-2">תדירות</label>
                <select id="frequency" class="p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none bg-white transition-all">
                    <option value="DAILY">יומי</option>
                    <option value="WEEKLY">שבועי</option>
                    <option value="MONTHLY">חודשי</option>
                </select>
            </div>

            <div class="flex flex-col">
                <label class="font-semibold text-slate-700 mb-2">תאריך התחלה</label>
                <input id="startDate" type="date" class="p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>

            <div class="flex flex-col">
                <label class="font-semibold text-slate-700 mb-2">תאריך סיום</label>
                <input id="endDate" type="date" class="p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>
        </div>

        <!-- Submit Button -->
        <button onclick="fetchData()" id="mainBtn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl text-xl btn-glow transition-all duration-300 flex items-center justify-center gap-3">
            <span>טען נתונים</span>
            <div id="loader" class="hidden w-6 h-6 border-4 border-white/30 loader rounded-full"></div>
        </button>

        <!-- Status Messages -->
        <div id="statusMsg" class="hidden mt-6 p-4 rounded-xl text-center font-semibold"></div>

        <!-- Preview Section -->
        <div id="previewContainer" class="hidden mt-10 overflow-x-auto rounded-xl border border-slate-200">
            <h3 class="text-xl font-bold text-slate-800 mb-4 px-2">תצוגה מקדימה</h3>
            <div id="tableContent"></div>
        </div>

        <!-- Export Buttons -->
        <div id="exportArea" class="hidden mt-8 grid grid-cols-1 md:grid-cols-2 gap-4">
            <button onclick="downloadCSV()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                📂 הורד כ-CSV
            </button>
            <button onclick="exportToSheet()" id="sheetBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                📊 ייצא ל-Google Sheets
                <div id="sheetLoader" class="hidden w-4 h-4 border-2 border-white/30 loader rounded-full"></div>
            </button>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxVFuSVtbxOEbR2qoEMCI1cnWUn2DRZtcmKCeaFRj0/dev'; // החלף בכתובת ה-Deployment שלך
        let globalCsvData = "";

        async function fetchData() {
            const tickers = document.getElementById('tickers').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const frequency = document.getElementById('frequency').value;

            // ולידציה
            if (!tickers || !startDate || !endDate) {
                showAlert("אופס! נראה ששכחת למלא את כל השדות...", "error");
                return;
            }

            if (new Date(startDate) > new Date(endDate)) {
                showAlert("אופס! נראה שתאריך ההתחלה מאוחר מתאריך הסיום...", "error");
                return;
            }

            toggleLoading(true);

            const payload = {
                tickers: tickers,
                startDate: startDate,
                endDate: endDate,
                frequency: frequency,
                action: 'csv'
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === "success") {
                    globalCsvData = result.csvData;
                    renderPreviewTable(globalCsvData);
                    document.getElementById('exportArea').classList.remove('hidden');
                    document.getElementById('previewContainer').classList.remove('hidden');
                    showAlert("הנתונים נטענו בהצלחה!", "success");
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                showAlert("שגיאה במשיכת נתונים: " + error.message, "error");
            } finally {
                toggleLoading(false);
            }
        }

        function renderPreviewTable(csvText) {
            const rows = csvText.split('\n').slice(0, 7); // כותרת + 6 שורות
            let html = `<table class="min-w-full bg-white">
                <thead class="bg-slate-50 border-b">
                    <tr>`;
            
            const headers = rows[0].split(',');
            headers.forEach(h => html += `<th class="px-4 py-3 text-right text-sm font-bold text-slate-700">${h}</th>`);
            html += `</tr></thead><tbody>`;

            for (let i = 1; i < rows.length; i++) {
                if (!rows[i]) continue;
                html += `<tr class="border-b hover:bg-slate-50 transition-colors">`;
                const cells = rows[i].split(',');
                cells.forEach(c => html += `<td class="px-4 py-3 text-sm text-slate-600">${c}</td>`);
                html += `</tr>`;
            }

            html += `</tbody></table>`;
            document.getElementById('tableContent').innerHTML = html;
        }

        function downloadCSV() {
            const blob = new Blob([globalCsvData], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `stock_data_${new Date().getTime()}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function exportToSheet() {
            const btn = document.getElementById('sheetBtn');
            const loader = document.getElementById('sheetLoader');
            
            btn.disabled = true;
            loader.classList.remove('hidden');

            const payload = {
                tickers: document.getElementById('tickers').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                frequency: document.getElementById('frequency').value,
                action: 'sheet'
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "success") {
                    showAlert(`הגיליון נוצר בהצלחה! <a href="${result.sheetUrl}" target="_blank" class="underline">לחץ כאן לצפייה</a>`, "success");
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                showAlert("ייצוא לגיליון נכשל: " + error.message, "error");
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }

        function toggleLoading(isLoading) {
            const btn = document.getElementById('mainBtn');
            const loader = document.getElementById('loader');
            btn.disabled = isLoading;
            if (isLoading) {
                loader.classList.remove('hidden');
                btn.querySelector('span').innerText = "מושך נתוני שוק...";
            } else {
                loader.classList.add('hidden');
                btn.querySelector('span').innerText = "טען נתונים";
            }
        }

        function showAlert(msg, type) {
            const alert = document.getElementById('statusMsg');
            alert.innerHTML = msg;
            alert.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            
            if (type === "error") {
                alert.classList.add('bg-red-100', 'text-red-700');
            } else {
                alert.classList.add('bg-green-100', 'text-green-700');
            }
        }
    </script>
</body>
</html>
