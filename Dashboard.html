<script>
    const WEB_APP_URL = 'כאן_שמים_את_הכתובת_של_הסקריפט'; 
    let globalCsvData = "";

    function validateForm(payload) {
        const tickersRaw = payload.tickers.trim();
        const start = new Date(payload.startDate);
        const end = new Date(payload.endDate);
        
        if (!tickersRaw || !payload.startDate || !payload.endDate) return "יש למלא את כל השדות.";
        
        // ולידציה של טיקרים: מותר רק אותיות, מספרים, נקודות (למניות זרות) ופסיקים
        const tickerRegex = /^[A-Z0-9., ]+$/i;
        if (!tickerRegex.test(tickersRaw)) {
            return "סימולי המניות מכילים תווים לא חוקיים. השתמש באותיות באנגלית בלבד.";
        }

        const tickersList = tickersRaw.split(',').filter(t => t.trim() !== "");
        if (tickersList.length > 10) return "ניתן להזין עד 10 מניות במקביל.";
        if (start >= end) return "תאריך ההתחלה חייב להיות מוקדם מתאריך הסיום.";
        
        return null;
    }

    async function fetchData() {
        const payload = {
            tickers: document.getElementById('tickers').value,
            startDate: document.getElementById('startDate').value,
            endDate: document.getElementById('endDate').value,
            frequency: document.getElementById('frequency').value,
            action: 'csv'
        };

        const error = validateForm(payload);
        if (error) { showAlert(error, "error"); return; }

        toggleLoading(true);
        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            
            if (result.status === "success") {
                globalCsvData = result.csvData;
                renderPreviewTable(globalCsvData);
                document.getElementById('exportArea').classList.remove('hidden');
                document.getElementById('previewContainer').classList.remove('hidden');

                // בדיקה אם היו טיקרים שגויים בתוך הצלחה
                if (result.invalidTickers && result.invalidTickers.length > 0) {
                    showAlert(`הנתונים נטענו, אך לא נמצאו נתונים עבור הסימולים הבאים: ${result.invalidTickers.join(', ')}. וודא שהם כתובים נכון.`, "warning");
                } else {
                    showAlert("הנתונים נשלפו בהצלחה!", "success");
                }
            } else {
                throw new Error(result.message);
            }
        } catch (err) { 
            showAlert(err.message, "error"); 
        } finally { 
            toggleLoading(false); 
        }
    }

    function showAlert(msg, type) {
        const el = document.getElementById('statusMsg');
        el.innerHTML = msg; el.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-yellow-100', 'text-yellow-700');
        
        if (type === "error") el.classList.add('bg-red-100', 'text-red-700');
        else if (type === "warning") el.classList.add('bg-yellow-100', 'text-yellow-700');
        else el.classList.add('bg-green-100', 'text-green-700');
    }

    // ... (יתר פונקציות העזר כמו renderPreviewTable ו-toggleLoading נשארות זהות)
</script>
